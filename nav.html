<!DOCTYPE html>
<html>

<head>

	<!-- Font Awesome -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">

	<!-- Google Font -->

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
	<!-------->

	<style>
		* {
			margin: 0;
			padding: 0;
			-webkit-box-sizing: border-box;
			box-sizing: border-box;
		}


		.navMenu {
			 font-family: "Tiny5", sans-serif;
			padding: 8px;
			text-align: center;
			margin: 7px auto;
			width: fit-content;
		}

		.navMenu a {
			color: #6e1b1e;
			text-decoration: none;
			text-transform: uppercase;
			display: inline-block;
			padding: 6px;
		}

		.background {
			background-color: #bfd6c5;
		}

		.border {
			border: 1px solid #cccccc;

		}

		.navMenu a:hover {

			color: #ad495b;
		}
	</style>
</head>

<body>

	<nav class="navMenu  border background">
		<a id="home" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-house"></i> Home</a>
		<a id="welcome_center" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-graduation-cap"></i> Welcome Center</a>

	</nav>


	<script>

		let direction = "vertical";
		if (direction === "vertical") {
			document.head.insertAdjacentHTML("beforeend", `<style>.navMenu a {display: block; text-align:left; margin:7px} i{width:15px; margin-right:5px} .navMenu{margin:3px}</style>`)
		}


		function navigate(id) {

			if (id == 'home')
				window.open("https://app.notion.com/p/Personal-Home-16adeacf175d49dbb3dd453f60ad32ee?source=copy_link", '_blank').focus();
	
			else if (id == 'welcome_center')
				window.open("https://app.notion.com/p/Welcome-Center-01d0f023bf9c4ed38a9f2514e325d771?source=copy_link", '_blank').focus();

			
		}
	</script>


</body>

</html>
